name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest   # has Docker, so the Testcontainers tests run too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
